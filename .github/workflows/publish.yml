name: Publish NuGet

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Pack
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          assembly="${version%%-*}"
          dotnet pack src/ValidSphere/ValidSphere.csproj --configuration Release --output artifacts -p:PackageVersion="$version" -p:AssemblyVersion="$assembly" -p:FileVersion="$assembly" -p:InformationalVersion="$version" -p:ContinuousIntegrationBuild=true
      - name: Authenticate with NuGet.org
        id: nuget
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish
        run: |
          dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "artifacts/*.snupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
